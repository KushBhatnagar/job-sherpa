# Starter list: ~100 tech companies with public job boards, verified against
# their live boards in Oct 2026. Strong on AI, data, developer tools, fintech and
# security, with many India-headquartered companies. `sherpa init` copies it to
# me/companies.yaml, where it's yours to edit: delete what you don't want, add
# your own targets.
#
# Fields: name, ats_type (greenhouse | lever | ashby | smartrecruiters),
# ats_token (the board's name in its URL), notes.
#
# Find a company's board: open its careers page, click through to the job list,
# and read the URL: boards.greenhouse.io/<token>, jobs.lever.co/<token>,
# jobs.ashbyhq.com/<token>, jobs.smartrecruiters.com/<token>.
# Check the whole file any time with `sherpa check-companies`; companies change
# ATS quietly. Pull requests with more companies, or new regional lists, welcome.

